name: starFate
options:
  bundleIdPrefix: com.starfate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "6.0"
  TARGETED_DEVICE_FAMILY: "1"  # iPhone only
  INFOPLIST_FILE: Info.plist
  DEVELOPMENT_TEAM: ""

targets:
  starFate:
    type: application
    platform: iOS
    sources:
      - Sources/starFate
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.starfate.app
      PRODUCT_NAME: "星命"
      INFOPLIST_FILE: Info.plist
      GENERATE_INFOPLIST_FILE: false
      SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Info.plist
    dependencies: []
    preBuildScripts: []
